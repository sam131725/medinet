name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install build dependencies (cgo needs gcc + sqlite headers)
        run: sudo apt-get update && sudo apt-get install -y build-essential libsqlite3-dev

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet -mod=vendor ./...

      - name: Build
        run: go build -mod=vendor -o medistock .

      - name: Test
        run: go test -mod=vendor -race -v ./...
